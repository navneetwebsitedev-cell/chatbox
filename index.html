<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Chatspace: private one-to-one chat">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chatspace">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chatspace</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[data-theme=dark]{color-scheme:dark;--bg:#000;--p1:#000;--p2:#262626;--p3:#262626;--line:#262626;--tx:#f5f5f5;--mu:#a8a8a8;--them:#262626;--hov:#121212}
[data-theme=light]{color-scheme:light;--bg:#fafafa;--p1:#fff;--p2:#efefef;--p3:#fff;--line:#dbdbdb;--tx:#262626;--mu:#8e8e8e;--them:#efefef;--hov:#fafafa}
:root{--ac:#3797f0;--acd:#fff}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs,14px)/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea{outline:none}
.fld{width:100%;background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.fld:focus{border-color:var(--mu)}
.hide{display:none!important}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--tx);flex:none}
.ic:hover{background:var(--p2)}
.ic.sm{width:32px;height:32px;font-size:19px}
.btn{display:block;width:100%;margin-top:10px;padding:10px;border-radius:8px;background:var(--ac);color:var(--acd);font-weight:600}
.btn.alt{background:var(--p2);color:var(--tx)}
.btn:disabled{opacity:.5}
.btn2{margin-top:8px;padding:7px 14px;border-radius:8px;background:var(--p2);font-weight:600}
.ghost{padding:6px 12px;border-radius:8px;background:var(--p2);font-weight:600;font-size:13px}
.danger{color:#ed4956}
.av{position:relative;width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;font-size:18px;background-size:cover;background-position:center}
.av.lg{width:88px;height:88px;font-size:32px}
.av .dot{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:#22c55e;border:2px solid var(--p1);display:none}
.av.live .dot{display:block}
.badge{padding:1px 8px;border-radius:9px;background:var(--ac);color:var(--acd);font-size:10px;font-weight:700;margin-left:6px;vertical-align:middle;white-space:nowrap}
.toast{position:fixed;top:16px;left:0;right:0;margin:0 auto;width:max-content;max-width:92vw;z-index:99;background:var(--p3);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px #0006;animation:in .2s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.note{min-height:20px;margin-top:12px;font-size:13px;color:var(--mu)}
.err{color:#ed4956}

#auth{min-height:100%;display:grid;place-items:center;padding:20px}
.card{width:min(350px,100%);text-align:center;padding:34px 40px;border:1px solid var(--line);border-radius:4px;background:var(--p1)}
.logo{font-size:32px;font-weight:700;letter-spacing:-.8px;margin:6px 0 20px}
.card p{color:var(--mu);margin:0 0 14px}
.f{position:relative;margin:6px 0}
.f label{display:block;text-align:left;font-size:12px;color:var(--mu);margin:0 0 4px}
.eye{position:absolute;right:10px;top:33px;color:var(--mu);font-weight:600;font-size:13px}
.keep{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mu);margin:14px 0 2px;text-align:left}
.keep input{width:16px;height:16px;padding:0;accent-color:var(--ac)}
.link{display:block;margin:16px auto 0;color:var(--ac);font-weight:600}

#app{height:100dvh;display:grid;grid-template-columns:350px 1fr;background:var(--p1)}
@media(min-width:768px){
#app{max-width:935px;height:min(calc(100dvh - 40px),820px);margin:20px auto;border:1px solid var(--line);border-radius:12px;overflow:hidden}
#app.info{grid-template-columns:350px 1fr 300px}
}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.sh{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 12px 0 20px;flex:none}
.uname{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px;min-width:0}
#userName{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srch{padding:4px 16px 10px;position:relative;flex:none}
.srch .fld{padding-left:36px;border:0;background:var(--p2);border-radius:8px}
.srch:before{content:"⌕";position:absolute;left:28px;top:7px;color:var(--mu);font-size:18px;pointer-events:none}
.ltitle{padding:4px 20px 10px;font-weight:700;font-size:16px;flex:none}
.list{flex:1;overflow:auto;padding-bottom:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:8px 20px;text-align:left}
.row:hover{background:var(--hov)}
.row.on{background:var(--p2)}
.row .av{width:56px;height:56px;font-size:18px}
.t{flex:1;min-width:0;display:flex;flex-direction:column}
.t b,.t small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t b{font-weight:400;font-size:14px}
.t small{color:var(--mu);font-size:14px}
.row.unread .t b{font-weight:700}
.row.unread .t small{color:var(--tx);font-weight:600}
.udot{width:8px;height:8px;border-radius:50%;background:var(--ac);flex:none}
.empty{padding:28px 20px;text-align:center;color:var(--mu)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.chh{display:flex;align-items:center;gap:12px;height:60px;padding:0 14px 0 16px;border-bottom:1px solid var(--line);flex:none}
.back{display:none;font-size:30px;line-height:1;padding:0 6px 4px 0}
.who{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.who .av{width:32px;height:32px;font-size:12px}
.who .w{min-width:0}
.who b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--mu);font-size:12px}
.sbar{padding:8px 16px;border-bottom:1px solid var(--line);flex:none}
.sbar .fld{border-radius:8px;background:var(--p2);border:0}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;padding:0 16px 8px;background:var(--cbg,transparent);background-size:cover;background-position:center}
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 0 18px}
.intro b{font-size:20px;font-weight:600;margin-top:12px}
.intro small{color:var(--mu);margin-top:2px}
.ts{align-self:center;margin:18px 0 8px;font-size:12px;color:var(--mu)}
.ph{margin:auto;text-align:center;color:var(--mu);padding:20px}
.mr{display:flex;align-items:flex-end;gap:8px;margin-top:2px}
.mr.first{margin-top:12px}
.mr.me{justify-content:flex-end}
.sav{width:28px;flex:none;display:flex}
.sav .av{width:28px;height:28px;font-size:10px}
.b{position:relative;max-width:min(70%,460px);padding:8px 14px;border-radius:22px;background:var(--them);color:var(--tx);overflow-wrap:anywhere;white-space:pre-wrap;cursor:pointer;animation:in .18s}
.mr.me .b{background:var(--mebg,var(--ac));color:var(--metx,#fff)}
.b a{color:inherit}
.b .acts{display:none;gap:6px;margin-top:6px;white-space:normal}
.b.sel .acts{display:flex}
.b .acts button{font-size:12px;padding:3px 10px;border-radius:12px;background:rgba(127,127,127,.25)}
.dots{display:flex;gap:4px;align-items:center;padding:13px 14px;cursor:default}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.3}40%{opacity:1}}
.dn{display:none;position:absolute;right:16px;bottom:84px;width:36px;height:36px;border-radius:50%;background:var(--p2);border:1px solid var(--line);font-size:16px}
.dn.on{display:block}
.comp{padding:10px 16px 14px;flex:none;background:var(--p1)}
.pill{display:flex;align-items:flex-end;gap:4px;border:1px solid var(--line);border-radius:22px;padding:2px 6px 2px 12px;min-height:44px}
.msgin{flex:1;min-width:0;resize:none;border:0;background:none;padding:10px 4px;max-height:120px;line-height:1.35;font-size:14px}
.msgin::placeholder{color:var(--mu)}
.msgin:disabled{opacity:.5}
.sendt{color:var(--ac);font-weight:600;padding:9px 10px;font-size:14px}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:6px 16px;border-top:1px solid var(--line)}
.emo button{font-size:22px;padding:4px;border-radius:8px}
.emo button:hover{background:var(--p2)}
.es{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:4px}
.es .ring{width:96px;height:96px;border-radius:50%;border:2px solid var(--tx);display:grid;place-items:center;font-size:40px;margin-bottom:12px}
.es h3{margin:0;font-size:22px;font-weight:400}
.es p{margin:0 0 10px;color:var(--mu)}
.es .btn{width:auto;padding:8px 16px}
#main.nochat .chatonly{display:none}
#main.nochat #msgs{display:none}
#empty{display:none}
#main.nochat #empty{display:flex}

.info{display:none;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--p1);overflow:auto}
#app.info .info{display:flex}
.ih{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 16px;font-weight:600;flex:none;border-bottom:1px solid var(--line)}
.iprof{display:flex;flex-direction:column;align-items:center;padding:24px 16px 18px;text-align:center}
.iprof b{font-size:16px;margin-top:10px}
.iprof small{color:var(--mu)}
.isec{border-top:1px solid var(--line);padding:6px 0}
.irow{display:block;width:100%;text-align:left;padding:11px 18px;font-size:14px}
.irow:hover{background:var(--hov)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 18px;font-size:14px}
.kv span{color:var(--mu)}

.menu{position:fixed;z-index:50;min-width:220px;padding:6px;background:var(--p3);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px #0008;animation:in .15s}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px}
.menu button:hover{background:var(--hov)}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.6)}
.mbox{width:min(400px,100%);max-height:85dvh;display:flex;flex-direction:column;background:var(--p1);border-radius:14px;overflow:hidden;animation:in .2s}
.mh{position:relative;display:flex;align-items:center;justify-content:center;min-height:52px;padding:14px 48px;border-bottom:1px solid var(--line);font-weight:600;flex:none}
.mh h2{margin:0;font-size:16px}
.mh .x{position:absolute;right:10px;top:12px;font-size:18px;padding:2px 8px}
.mb{padding:14px 20px 18px;overflow:auto}
.mb .row{padding:8px 0}
.mb .row:hover{background:none}
.mb .row:hover .t b{text-decoration:underline}
.lbl{display:block;font-size:12px;color:var(--mu);margin:12px 0 6px}
.tg{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.tg input{width:20px;height:20px;padding:0;accent-color:var(--ac)}
.row2{display:flex;gap:10px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.sw .on{border-color:var(--tx)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mu)}
.tile i{display:block;width:100%;height:56px;border-radius:12px;border:2px solid var(--line);position:relative;overflow:hidden}
.tile.on i{border-color:var(--ac)}
.tile i:after{content:"";position:absolute;right:8px;bottom:8px;width:55%;height:12px;border-radius:6px;background:var(--tc)}
.sec{margin:14px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.u{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.u .i{flex:1;min-width:0}
.u .i b,.u .i small{display:block;overflow-wrap:anywhere}
.u small{color:var(--mu);font-size:12px}
.u .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 12px}
.stats div{background:var(--p2);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:16px}
.stats span{font-size:11px;color:var(--mu)}

@media(max-width:767px){
#app{grid-template-columns:1fr;height:100dvh;border:0;border-radius:0;margin:0;max-width:none}
#app.info{grid-template-columns:1fr}
#app .main{display:none}
#app.open .side{display:none}
#app.open .main{display:flex}
#app.info .info{position:fixed;inset:0;z-index:30}
.back{display:block}
.b{max-width:80%}
.card{padding:30px 24px}
}
</style>
</head>
<body>
<section id="auth">
 <div class="card">
  <div class="logo">Chatspace</div>
  <p id="asub">Log in to continue.</p>
  <form id="af">
   <div id="uf" class="f hide"><label for="un">Username</label><input id="un" class="fld" maxlength="20" autocomplete="username" placeholder="letters, numbers, underscore"></div>
   <div class="f"><label for="em">Email</label><input id="em" class="fld" type="email" autocomplete="email" placeholder="Email" required></div>
   <div class="f"><label for="pw">Password</label><input id="pw" class="fld" type="password" autocomplete="current-password" placeholder="Password" required><button type="button" id="eye" class="eye">Show</button></div>
   <label class="keep"><input id="keep" type="checkbox"> Keep me signed in on this device</label>
   <button id="as" class="btn" type="submit">Log in</button>
  </form>
  <button id="sw" class="link" type="button">Create new account</button>
  <div id="an" class="note" role="status"></div>
 </div>
</section>

<section id="app" class="hide">
 <aside class="side">
  <div class="sh">
   <button id="userBtn" class="uname" type="button"><span id="userName"></span><i style="font-style:normal">▾</i></button>
   <button id="composeBtn" class="ic" type="button" aria-label="New message" title="New message">✎</button>
  </div>
  <div class="srch"><input id="q" class="fld" placeholder="Search" aria-label="Search"></div>
  <div class="ltitle">Messages</div>
  <div id="list" class="list"></div>
 </aside>

 <main id="main" class="main nochat">
  <header class="chh chatonly">
   <button id="back" class="back" type="button" aria-label="Back">‹</button>
   <button id="who" class="who" type="button"><span id="pav"></span><span class="w"><b id="pn"></b><small id="ps"></small></span></button>
   <button id="srchBtn" class="ic" type="button" aria-label="Search in conversation" title="Search">⌕</button>
   <button id="infoBtn" class="ic" type="button" aria-label="Details" title="Details">ⓘ</button>
  </header>
  <div id="sbar" class="sbar chatonly hide"><input id="cs" class="fld" placeholder="Search in conversation" aria-label="Search in conversation"></div>
  <div id="empty" class="es">
   <div class="ring">✉</div>
   <h3>Your messages</h3>
   <p>Send private messages to a friend.</p>
   <button id="emptySend" class="btn" type="button">Send message</button>
  </div>
  <div id="msgs" class="msgs"></div>
  <button id="dn" class="dn" type="button" aria-label="Scroll to latest">↓</button>
  <div id="emo" class="emo hide"></div>
  <form id="comp" class="comp chatonly">
   <div class="pill">
    <button id="emoBtn" class="ic sm" type="button" aria-label="Emoji">🙂</button>
    <textarea id="msg" class="msgin" rows="1" placeholder="Message..." aria-label="Message" disabled></textarea>
    <button id="heart" class="ic sm" type="button" aria-label="Send heart">❤️</button>
    <button id="send" class="sendt hide" type="submit">Send</button>
   </div>
  </form>
 </main>

 <aside id="info" class="info">
  <div class="ih"><span>Details</span><button id="infoX" class="ic" type="button" aria-label="Close details">✕</button></div>
  <div id="infoBody"></div>
 </aside>
</section>

<div id="modal" class="modal hide"></div>
<div id="adm" class="modal hide">
 <div class="mbox" style="width:min(640px,100%)">
  <div class="mh"><h2>Admin dashboard</h2><button id="admClose" class="x" type="button" aria-label="Close">✕</button></div>
  <div class="mb">
   <div id="admStats" class="stats"></div>
   <input id="admQ" class="fld" type="search" placeholder="Search username or email" style="margin-bottom:8px">
   <div id="admList"></div>
  </div>
 </div>
</div>
<input id="wpf" type="file" accept="image/*" class="hide">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Public anon key only (browser-safe). Never put the service-role key here.
const SB_URL="https://isljliwaeioumljcbnkk.supabase.co",SB_KEY="sb_publishable_AOUfT8csSBswnlksoLjr2Q_ghuNlSah";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>esc(s).replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
const LS=(k,d)=>{try{return{...d,...JSON.parse(localStorage.getItem(k)||"null")}}catch{return{...d}}};
const SAVE=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{toast("Device storage full: kuch local data reset karo")}};
const T=v=>{const t=new Date(v).getTime();return isNaN(t)?Date.parse(String(v).replace(/(\.\d{3})\d+/,"$1")):t};
const ftime=v=>new Date(T(v)).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const fdate=v=>new Date(T(v)).toLocaleDateString([],{day:"numeric",month:"short",year:"numeric"});
const dayLabel=v=>{const d=new Date(T(v)).toDateString();return d===new Date().toDateString()?"Today":d===new Date(Date.now()-864e5).toDateString()?"Yesterday":new Date(T(v)).toLocaleDateString([],{weekday:"short",day:"numeric",month:"short"})};
const rel=v=>{const s=(Date.now()-T(v))/1000;if(s<60)return"now";if(s<3600)return Math.floor(s/60)+"m";if(s<86400)return Math.floor(s/3600)+"h";if(s<604800)return Math.floor(s/86400)+"d";return fdate(v)};
const PAL=["#2563eb","#7c3aed","#db2777","#ea580c","#0d9488","#ca8a04","#4f46e5","#059669"];
const color=s=>PAL[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
const IMG=()=>SB_URL+"/storage/v1/object/public/avatars/";
const av=(name,url,live)=>{const ok=url&&String(url).startsWith(IMG());return`<span class="av${live?" live":""}" style="background-color:${color(name||"?")};${ok?`background-image:url('${esc(url)}')`:""}">${ok?"":esc((name||"?").slice(0,2).toUpperCase())}<i class="dot"></i></span>`};
const big=(...a)=>av(...a).replace('class="av','class="av lg');
const badge=()=>'<span class="badge">Admin</span>';
const toast=t=>{const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2800)};
const note=(t,e)=>{$("an").textContent=t;$("an").className="note"+(e?" err":"")};
const copy=t=>navigator.clipboard.writeText(t).then(()=>toast("Copied"),()=>toast("Copy not allowed here"));
const ink=h=>{const n=parseInt(h.slice(1),16);return((n>>16)*.299+(n>>8&255)*.587+(n&255)*.114)>153?"#111":"#fff"};

const ACC=["#3797f0","#a855f7","#e1306c","#f77737","#22c55e","#fcb045"];
const EMO=["😀","😂","😍","🥰","😎","🤔","😢","😡","👍","👎","🙏","👏","🔥","❤️","🎉","💯","😅","🤝","😴","🙌","✨","😉","🥳","😇","🙈","💀","👀","🫡"];
const PRE={ocean:{n:"Ocean",bg:"linear-gradient(160deg,#0b2545,#13315c)",me:"#38bdf8",metx:"#04202e",th:"#1c3d6b",thtx:"#e8f1ff"},
 sunset:{n:"Sunset",bg:"linear-gradient(160deg,#3b1c32,#7a2e3a)",me:"#fb923c",metx:"#2a1204",th:"#5a2a40",thtx:"#ffeef0"},

// ---------- data ----------
const vis=p=>(msgs.get(p)||[]).filter(m=>!L.hide.includes(m.id)&&T(m.created_at)>(L.clear[p]||0));
function ingest(m){const p=m.sender_id===me.id?m.receiver_id:m.sender_id,a=msgs.get(p)||[];if(a.some(x=>x.id===m.id))return null;a.push(m);a.sort((x,y)=>T(x.created_at)-T(y.created_at));msgs.set(p,a);return p}
const unread=p=>vis(p).filter(m=>m.sender_id===p&&T(m.created_at)>(READ[p]||0)).length;

function renderChat(force){
 if(!peer)return;
 const el=$("msgs"),bottom=el.scrollHeight-el.scrollTop-el.clientHeight<120,top=el.scrollTop;
 const a=vis(peer.id).filter(m=>!term||m.content.toLowerCase().includes(term));
 let h=`<div class="intro">${big(peer.username,peer.avatar_url,false)}<b>${esc(peer.username)}</b><small>Chatspace</small><button class="btn2" data-a="profile" type="button">View profile</button></div>`;
 let prev=null,pt=0;
 a.forEach((m,i)=>{
  const t=T(m.created_at),mine=m.sender_id===me.id,nx=a[i+1];
  const block=!prev||t-pt>=36e5||new Date(t).toDateString()!==new Date(pt).toDateString();
  if(block)h+=`<div class="ts">${dayLabel(m.created_at)} ${ftime(m.created_at)}</div>`;
  const first=block||prev.sender_id!==m.sender_id;
  const last=!nx||nx.sender_id!==m.sender_id||T(nx.created_at)-t>=36e5;
  const sv=mine?"":`<span class="sav">${last?av(peer.username,peer.avatar_url,false):""}</span>`;
  h+=`<div class="mr${mine?" me":""}${first?" first":""}">${sv}<div class="b" data-id="${m.id}">${fmt(m.content)}<div class="acts"><button data-a="copy" type="button">Copy</button><button data-a="hide" type="button">Hide</button></div></div></div>`;
  prev=m;pt=t});
 if(term&&!a.length)h+=`<div class="ph">Is search me kuch nahi mila.</div>`;
 if(typingOn)h+=`<div class="mr first"><span class="sav">${av(peer.username,peer.avatar_url,false)}</span><div class="b dots"><i></i><i></i><i></i></div></div>`;
 el.innerHTML=h;
 el.scrollTop=(force||bottom)?el.scrollHeight:top;
 $("dn").classList.toggle("on",!(force||bottom)&&!term)}

function openChat(p){
 peer=p;term="";$("cs").value="";$("sbar").classList.add("hide");$("app").classList.add("open");$("main").classList.remove("nochat");
 $("msg").disabled=false;typingOn=false;

function closeChat(){

function flip(k,p){const i=L[k].indexOf(p.id);i<0?L[k].push(p.id):L[k].splice(i,1);SAVE("cs_loc",L);renderList();head();if(peer)renderInfo()}
function clearChat(p){if(!p||!confirm(`${p.username} ka chat is device se clear hoga (server pe messages rahenge).`))return;L.clear[p.id]=Date.now();SAVE("cs_loc",L);if(peer?.id===p.id)renderChat(true);renderList();renderInfo()}
function exportChat(p){
 const t=vis(p.id).map(m=>`[${new Date(T(m.created_at)).toLocaleString()}] ${m.sender_id===me.id?myname:p.username}: ${m.content}`).join("\n");
 if(!t)return toast("Export ke liye kuch nahi hai");
 const u=URL.createObjectURL(new Blob([t],{type:"text/plain"})),a=document.createElement("a");
 a.href=u;a.download=`chat-${p.username}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const chatItems=p=>[[L.pin.includes(p.id)?"📌 Unpin chat":"📌 Pin chat",()=>flip("pin",p)],[L.mute.includes(p.id)?"🔔 Unmute":"🔕 Mute notifications",()=>flip("mute",p)],["🧹 Clear chat (this device)",()=>clearChat(p)],["⬇️ Export chat",()=>exportChat(p)]];

async function uploadPhoto(f,say){
 if(!f?.type.startsWith("image/"))return say("Image file chuniye.",1);
 say("Uploading…");
 try{const b=await createImageBitmap(f),c=document.createElement("canvas"),s=Math.min(b.width,b.height);c.width=c.height=256;
  c.getContext("2d").drawImage(b,(b.width-s)/2,(b.height-s)/2,s,s,0,0,256,256);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.85)),path=me.id+"/avatar.jpg",st=sb.storage.from("avatars");
  const{error}=await st.upload(path,blob,{upsert:true,contentType:"image/jpeg",cacheControl:"3600"});if(error)throw error;
  await setAvatar(st.getPublicUrl(path).data.publicUrl+"?v="+Date.now());say("Photo updated ✔")
 }catch(x){say((x.message||"Upload failed")+" (avatars bucket check karo)",1)}}

   me=data.user;myname=n;const p=profiles.find(x=>x.id===me.id);if(p)p.username=n;

function openAdmin(){if(!adminOK)return toast("Admin permission nahi hai");$("adm").classList.remove("hide");renderAdmin();refreshAdmin()}
async function refreshAdmin(){
 const{data,error}=await sb.functions.invoke("admin-list-users",{body:{}});
 if(error||!data?.success){$("admList").innerHTML=`<div class="err">${esc(data?.error||error?.message||"Load failed")}</div>`;return}
 adminCache=data.users||[];renderAdmin()}
async function act(u,action){
 if(!confirm(`${action.replace("_"," ")}: ${u.username}?`))return;
 const{data,error}=await sb.functions.invoke("admin-manage-user",{body:{targetUserId:u.id,action}});
 if(error||!data?.success)return toast(data?.error||error?.message||"Action failed (admin-manage-user function check karo)");
 toast("Done");
 if(action==="remove_photo"){const p=profiles.find(x=>x.id===u.id);if(p)p.avatar_url=null;renderList()}
 renderAdmin()}

// ---------- boot & realtime ----------
async function boot(user){
 me=user;
 const{data:pr,error}=await selProfiles(c=>sb.from("profiles").select(c).eq("id",user.id).single());
 if(error||!pr){note("Profile nahi mila. Setup SQL run karo, phir signup karo.",1);return}
 myname=pr.username;myurl=pr.avatar_url||"";isAdmin=!!pr.is_admin;
 $("auth").classList.add("hide");$("app").classList.remove("hide");renderMe();
 const[ps,ms,th]=await Promise.all([
  selProfiles(c=>sb.from("profiles").select(c).order("username")),
  sb.from("messages").select("id,sender_id,receiver_id,content,created_at").order("created_at",{ascending:false}).limit(1000),
  sb.from("chat_themes").select("*")]);
 if(ps.error||ms.error)toast((ps.error||ms.error).message);
 profiles=ps.data||[];(ms.data||[]).forEach(ingest);
 msgs.forEach((a,p)=>{if(READ[p]===undefined&&a.length)READ[p]=T(a.at(-1).created_at)});SAVE("cs_read",READ);
 (th.data||[]).forEach(r=>themes.set(r.user_a===me.id?r.user_b:r.user_a,r));
 renderList();await checkAdmin();live()}
function beep(){if(!S.sound)return;try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();g.gain.value=.05;o.frequency.value=880;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch{}}
function incoming(m,p){
 if(L.mute.includes(p))return;
 const u=profiles.find(x=>x.id===p),n=u?u.username:"Someone";beep();
 if(!(peer?.id===p&&!document.hidden))toast(`${n}: ${m.content.slice(0,50)}`);
 if(S.notif&&document.hidden&&"Notification" in window&&Notification.permission==="granted")new Notification(n,{body:m.content.slice(0,120)})}
function live(){
 if(chan)sb.removeChannel(chan);
 chan=sb.channel("cs-main",{config:{presence:{key:me.id}}})
 .on("presence",{event:"sync"},()=>{online=new Set(Object.keys(chan.presenceState()));renderList();head();if(peer)renderInfo();if(!$("adm").classList.contains("hide"))renderAdmin()})
 .on("broadcast",{event:"typing"},({payload:p})=>{if(peer&&p.from===peer.id&&p.to===me.id){typingOn=true;renderChat();clearTimeout(typeT);typeT=setTimeout(()=>{typingOn=false;if(peer)renderChat()},2500)}})
 .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},({new:m})=>{
  if(m.sender_id!==me.id&&m.receiver_id!==me.id)return;
  const p=ingest(m);if(!p)return;
  if(m.sender_id!==me.id)incoming(m,p);
  if(peer?.id===p){if(m.sender_id!==me.id&&!document.hidden)markRead(p);typingOn=false;renderChat()}
  renderList()})
 .on("postgres_changes",{event:"INSERT",schema:"public",table:"profiles"},({new:p})=>{if(!profiles.some(x=>x.id===p.id)){profiles.push(p);renderList()}})
 .on("postgres_changes",{event:"UPDATE",schema:"public",table:"profiles"},({new:p})=>{
  const x=profiles.find(y=>y.id===p.id);if(x)Object.assign(x,p);
  if(p.id===me.id){myurl=p.avatar_url||"";myname=p.username;renderMe()}
  head();renderList()})
 .on("postgres_changes",{event:"DELETE",schema:"public",table:"profiles"},({old:p})=>{profiles=profiles.filter(x=>x.id!==p.id);msgs.delete(p.id);if(peer?.id===p.id)closeChat();renderList()})
 .subscribe(s=>{if(s==="SUBSCRIBED")chan.track({at:Date.now()})});
 if(tchan)sb.removeChannel(tchan);
 tchan=sb.channel("cs-themes").on("postgres_changes",{event:"*",schema:"public",table:"chat_themes"},({new:r})=>{
  if(!r?.user_a||(r.user_a!==me.id&&r.user_b!==me.id))return;
  const pid=r.user_a===me.id?r.user_b:r.user_a;themes.set(pid,r);
  if(peer?.id===pid){paint();if(r.updated_by!==me.id)toast(`${peer.username} ne chat theme badla`)}}).subscribe()}
async function logout(){closeModal();if(chan)await sb.removeChannel(chan);if(tchan)await sb.removeChannel(tchan);await sb.auth.signOut();location.reload()}

// ---------- send ----------
function resize(){const t=$("msg");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,120)+"px"}
function sync(){const v=$("msg").value.trim();$("send").classList.toggle("hide",!v);$("heart").classList.toggle("hide",!!v);resize()}
async function dispatch(c){
 if(!c||!peer)return false;const pid=peer.id;
 const{data,error}=await sb.from("messages").insert({sender_id:me.id,receiver_id:pid,content:c}).select("id,sender_id,receiver_id,content,created_at").single();
 if(error){toast("Not sent: "+error.message);return false}
 ingest(data);if(peer?.id===pid){markRead(pid);renderChat(true)}renderList();return true}

// ---------- events ----------
$("sw").onclick=()=>{signup=!signup;$("uf").classList.toggle("hide",!signup);$("as").textContent=signup?"Sign up":"Log in";
 $("asub").textContent=signup?"Private chats with people you know.":"Log in to continue.";
 $("pw").autocomplete=signup?"new-password":"current-password";
 $("sw").textContent=signup?"Have an account? Log in":"Create new account";note("")};
$("eye").onclick=()=>{const p=$("pw"),s=p.type==="password";p.type=s?"text":"password";$("eye").textContent=s?"Hide":"Show"};
$("af").onsubmit=async e=>{
 e.preventDefault();const email=$("em").value.trim(),pw=$("pw").value,un=$("un").value.trim();
 $("as").disabled=true;note("Ek second…");
 try{localStorage.setItem("cs_keep",$("keep").checked?"1":"0");sessionStorage.setItem("cs_alive","1")}catch{}
 try{
  if(signup){
   if(!/^[A-Za-z0-9_]{3,20}$/.test(un))throw new Error("Username 3–20 letters, numbers ya underscore.");
   const{data,error}=await sb.auth.signUp({email,password:pw,options:{data:{username:un}}});if(error)throw error;
   if(data.session)await boot(data.user);else note("Account ban gaya. Email verify karo, phir login karo.")
  }else{const{data,error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;await boot(data.user)}
 }catch(x){note(x.message||"Kuch galat ho gaya.",1)}
 $("as").disabled=false};

$("comp").onsubmit=async e=>{e.preventDefault();const t=$("msg"),c=t.value.trim();if(!c)return;t.value="";sync();
 const ok=await dispatch(c);if(!ok&&!t.value){t.value=c;sync()}};
$("heart").onclick=()=>dispatch("❤️");
$("msg").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing&&(S.enter?!e.shiftKey:(e.ctrlKey||e.metaKey))){e.preventDefault();$("comp").requestSubmit()}};
$("msg").oninput=()=>{sync();if(chan&&peer&&Date.now()-typeSent>1500){typeSent=Date.now();chan.send({type:"broadcast",event:"typing",payload:{from:me.id,to:peer.id}})}};
$("emo").innerHTML=EMO.map(x=>`<button type="button">${x}</button>`).join("");
$("emo").onclick=e=>{const b=e.target.closest("button");if(!b)return;const t=$("msg");t.value+=b.textContent;t.focus();sync()};
$("emoBtn").onclick=()=>$("emo").classList.toggle("hide");

$("q").oninput=()=>{q=$("q").value;renderList()};
$("list").onclick=e=>{const r=e.target.closest(".row");if(!r)return;const p=profiles.find(x=>x.id===r.dataset.id);if(p)openChat(p)};
$("list").oncontextmenu=e=>{const r=e.target.closest(".row");if(!r)return;e.preventDefault();const p=profiles.find(x=>x.id===r.dataset.id);if(p)menu(e.clientX,e.clientY,chatItems(p))};
$("msgs").onclick=e=>{
 if(!peer)return;
 if(e.target.closest("[data-a=profile]"))return contactModal();
 const b=e.target.closest(".b");if(!b||e.target.tagName==="A")return;
 const a=e.target.closest("button[data-a]"),m=(msgs.get(peer.id)||[]).find(x=>x.id===b.dataset.id);if(!m)return;
 if(!a){document.querySelectorAll(".b.sel").forEach(x=>{if(x!==b)x.classList.remove("sel")});b.classList.toggle("sel");return}
 if(a.dataset.a==="copy")copy(m.content);
 else{L.hide.push(m.id);SAVE("cs_loc",L);renderChat(true);renderList();toast("Is device pe hidden")}};
$("msgs").onscroll=()=>{const el=$("msgs");$("dn").classList.toggle("on",el.scrollHeight-el.scrollTop-el.clientHeight>200)};
$("dn").onclick=()=>$("msgs").scrollTo({top:1e9,behavior:"smooth"});
$("srchBtn").onclick=()=>{const s=$("sbar");s.classList.toggle("hide");if(s.classList.contains("hide")){term="";$("cs").value="";renderChat(true)}else $("cs").focus()};
$("cs").oninput=e=>{term=e.target.value.trim().toLowerCase();renderChat(true)};
$("infoBtn").onclick=()=>{if(!peer)return;const open=$("app").classList.toggle("info");if(open)renderInfo()};
$("who").onclick=()=>{if(peer){$("app").classList.add("info");renderInfo()}};
$("infoX").onclick=()=>$("app").classList.remove("info");
$("infoBody").onclick=e=>{
 const b=e.target.closest("[data-i]");if(!b||!peer)return;const k=b.dataset.i;
 const A={search:()=>{$("app").classList.remove("info");$("sbar").classList.remove("hide");$("cs").focus()},
  mute:()=>flip("mute",peer),pin:()=>flip("pin",peer),theme:themeModal,wp:()=>$("wpf").click(),
  export:()=>exportChat(peer),clear:()=>clearChat(peer)};
 A[k]?.()};
$("wpf").onchange=async e=>{
 const f=e.target.files[0];e.target.value="";if(!f||!peer)return;
 try{const b=await createImageBitmap(f),k=Math.min(1,1200/Math.max(b.width,b.height)),c=document.createElement("canvas");
  c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext("2d").drawImage(b,0,0,c.width,c.height);
  L.wp[peer.id]=c.toDataURL("image/jpeg",.75);SAVE("cs_loc",L);paint();toast("Wallpaper set (is device pe)")}
 catch{toast("Image load nahi hui")}};
$("back").onclick=closeChat;
$("composeBtn").onclick=composeModal;
$("emptySend").onclick=composeModal;
$("userBtn").onclick=e=>{const r=e.currentTarget.getBoundingClientRect();
 menu(r.left,r.bottom+6,[["👤 Profile",profileModal],["⚙️ Settings",settingsModal],...(adminOK?[["🛡️ Admin panel",openAdmin]]:[]),["🚪 Log out",logout]])};
$("modal").onclick=e=>{if(e.target.id==="modal"||e.target.closest("[data-close]"))closeModal()};
$("modal").addEventListener("click",e=>{const b=e.target.closest("button[data-a=profile]");if(b)contactModal()});
$("admQ").oninput=renderAdmin;
$("admClose").onclick=()=>$("adm").classList.add("hide");
$("adm").onclick=e=>{if(e.target.id==="adm")$("adm").classList.add("hide")};
$("admList").onclick=async e=>{
 const b=e.target.closest("button[data-a]");if(!b)return;
 const u=adminCache.find(x=>x.id===b.dataset.id);if(!u)return;const a=b.dataset.a;
 if(a==="msg"){$("adm").classList.add("hide");const p=profiles.find(x=>x.id===u.id);if(p)openChat(p);return}
 if(a==="more"){const r=b.getBoundingClientRect();return menu(r.right-220,r.bottom+4,[["📋 Copy email",()=>copy(u.email||"")],["🖼️ Remove photo",()=>act(u,"remove_photo")],["⏸️ Suspend account",()=>act(u,"suspend")],["▶️ Restore account",()=>act(u,"restore")]])}
 if(a==="del"){
  if(!confirm(`${u.username} ka account aur saare messages permanently delete honge. Undo nahi hoga. Continue?`))return;
  b.disabled=true;
  const{data,error}=await sb.functions.invoke("admin-delete-user",{body:{targetUserId:u.id}});
  if(error||!data?.success){b.disabled=false;return toast(data?.error||error?.message||"Delete failed")}
  adminCache=adminCache.filter(x=>x.id!==u.id);profiles=profiles.filter(p=>p.id!==u.id);msgs.delete(u.id);
  if(peer?.id===u.id)closeChat();renderAdmin();renderList();toast("User permanently deleted")}};
document.addEventListener("keydown",e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"&&!$("app").classList.contains("hide")){e.preventDefault();$("q").focus()}
 if(e.key==="Escape"){closeModal();$("adm").classList.add("hide");document.querySelectorAll(".menu").forEach(m=>m.remove())}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&peer){markRead(peer.id);renderList()}});

(async()=>{
 applySettings();matchMedia("(prefers-color-scheme: dark)").onchange=applySettings;
 if(!window.supabase){note("Supabase load nahi hua. Internet check karo.",1);return}
 sb=window.supabase.createClient(SB_URL,SB_KEY);
 let keep=false,alive=false;
 try{keep=localStorage.getItem("cs_keep")==="1";alive=!!sessionStorage.getItem("cs_alive");sessionStorage.setItem("cs_alive","1")}catch{}
 $("keep").checked=keep;
 const{data}=await sb.auth.getSession();
 if(data.session){if(!keep&&!alive)await sb.auth.signOut({scope:"local"});else await boot(data.session.user)}
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Chatspace</title>
<style>
:root{color-scheme:dark;--bg:#0f1117;--p1:#161a23;--p2:#1e2330;--line:#2a3142;--tx:#eef1f7;--mu:#8f9bb0;--ac:#6ee7b7;--acd:#0b1a14;--them:#232a3a}
:root[data-theme=light]{color-scheme:light;--bg:#f3f5f9;--p1:#fff;--p2:#eef1f6;--line:#d9dfea;--tx:#151a24;--mu:#5b667a;--them:#e8ecf3}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hidden{display:none!important}
.auth{min-height:100%;display:grid;place-items:center;padding:20px}
.card{width:min(400px,100%);background:var(--p1);border:1px solid var(--line);border-radius:18px;padding:28px}
.card h1{margin:0 0 4px;font-size:28px;letter-spacing:-.5px}
.card p{margin:0 0 20px;color:var(--mu)}
.field{margin:12px 0;position:relative}
.field label,.lbl{display:block;margin-bottom:6px;font-size:13px;color:var(--mu)}
input,textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:10px}
.field input,.mbox input,.mbox textarea,.mbox select{width:100%;padding:11px 13px}
.eye{position:absolute;right:6px;bottom:6px;border:0;background:none;color:var(--mu);padding:6px 8px;font-size:12px}
.btn{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:var(--acd);font-weight:700}
.btn.alt{background:var(--p2);color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.link{display:block;margin:14px auto 0;border:0;background:none;color:var(--ac)}
.note{min-height:20px;margin-top:12px;font-size:13px;color:var(--mu)}
.note.err{color:#ff8e8e}
.logo{width:48px;height:48px;border-radius:14px;background:var(--ac);color:var(--acd);display:grid;place-items:center;font-size:24px;margin-bottom:16px}
.keep{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:13px;color:var(--mu);cursor:pointer;user-select:none}
.keep input{width:16px;height:16px;padding:0;accent-color:var(--ac)}
.app{height:100dvh;display:grid;grid-template-columns:330px 1fr;max-width:1280px;margin:0 auto;background:var(--p1);border-inline:1px solid var(--line)}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.top b{display:block;line-height:1.2}
.top small{color:var(--ac);font-size:12px}
.me-btn{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;min-width:0}
.grow{flex:1;min-width:0}
.ghost{border:1px solid var(--line);background:none;border-radius:9px;padding:6px 10px;font-size:13px;color:var(--mu)}
.ic{border:0;background:none;font-size:18px;padding:6px 9px;border-radius:9px;color:var(--mu)}
.ic:hover{background:var(--p2)}
.av{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:14px;color:#fff}
.av.big{width:84px;height:84px;font-size:28px;margin:0 auto 10px}
.av i{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--ac);border:2px solid var(--p1)}
.srch{padding:12px 14px}
.srch input,.sbar input{width:100%;padding:10px 12px}
.list{flex:1;overflow:auto;padding:0 8px 10px}
.row{display:flex;gap:11px;align-items:center;width:100%;padding:10px;border:0;border-radius:12px;background:none;text-align:left}
.row:hover,.row.on{background:var(--p2)}
.row .nm{display:flex;justify-content:space-between;gap:8px}
.row .nm span,.row small{font-size:12px;color:var(--mu)}
.row b,.row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ac);color:var(--acd);font-size:12px;font-weight:700;display:grid;place-items:center}
.empty{padding:24px 12px;text-align:center;color:var(--mu);font-size:13px}
.chat{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.head{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line);min-height:65px}
.pinfo{display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;flex:1;min-width:0}
.head small{display:block;color:var(--mu);font-size:12px}
.head small.on{color:var(--ac)}
.back{display:none;border:0;background:none;font-size:22px;padding:2px 8px 2px 0}
.sbar{padding:8px 16px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:18px clamp(12px,4vw,36px);display:flex;flex-direction:column;gap:3px;background:var(--cbg,transparent)}
.tsw{width:64px;height:84px;border-radius:14px;border:2px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;justify-content:flex-end}
.tsw.on{border-color:var(--ac)}
.tsw i{display:block;height:12px;border-radius:6px;width:70%}
.tsw i+i{align-self:flex-end}
.ph{margin:auto;text-align:center;color:var(--mu);max-width:300px}
.ph b{display:block;color:var(--tx);font-size:17px;margin-bottom:4px}
.day{align-self:center;margin:12px 0 6px;padding:3px 12px;border-radius:12px;background:var(--p2);color:var(--mu);font-size:12px}
.m{max-width:min(78%,520px);align-self:flex-start;padding:8px 12px 6px;border-radius:16px 16px 16px 4px;background:var(--thbg,var(--them));color:var(--thtx,inherit);overflow-wrap:anywhere;white-space:pre-wrap;cursor:pointer}
.m.me{align-self:flex-end;background:var(--mebg,var(--ac));color:var(--metx,var(--acd));border-radius:16px 16px 4px 16px}
.m.gap{margin-top:8px}
.m a{color:inherit;text-decoration:underline}
.m em{display:block;text-align:right;font-style:normal;font-size:10px;opacity:.65;margin-top:2px}
.acts{display:flex;gap:6px;margin-top:6px;white-space:normal}
.acts button{border:1px solid currentColor;background:none;border-radius:8px;padding:2px 9px;font-size:12px;opacity:.8}
.typing{height:20px;padding:0 20px;font-size:12px;color:var(--ac)}
.dn{position:absolute;right:20px;bottom:92px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--p2);font-size:18px;z-index:5}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:6px 16px;border-top:1px solid var(--line)}
.emo button{border:0;background:none;font-size:22px;padding:4px;border-radius:8px}
.emo button:hover{background:var(--p2)}
.comp{display:flex;gap:8px;align-items:flex-end;padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.comp textarea{flex:1;resize:none;max-height:130px;padding:11px 14px;border-radius:14px;line-height:1.4}
.send{border:0;border-radius:14px;padding:11px 18px;background:var(--ac);color:var(--acd);font-weight:700}
.send:disabled,.comp textarea:disabled,.comp .ic:disabled{opacity:.4}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--p2);border:1px solid var(--line);padding:9px 16px;border-radius:12px;font-size:13px;z-index:60;max-width:90vw}
.menu{position:fixed;z-index:50;min-width:190px;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 30px #0006}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px}
.menu button:hover{background:var(--line)}
.modal,.admin-panel{position:fixed;inset:0;z-index:40;background:#000b;display:grid;place-items:center;padding:16px}
.mbox,.admin-box{width:min(460px,100%);max-height:90dvh;overflow:auto;background:var(--p1);border:1px solid var(--line);border-radius:18px;padding:20px}
.admin-box{width:min(650px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.mh h2{margin:0;font-size:20px}
.sec{margin:16px 0 4px;padding-top:14px;border-top:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.kv span{color:var(--mu)}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.sw button.on{border-color:var(--tx)}
.tg{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.tg input{width:20px;height:20px;accent-color:var(--ac)}
.admin-btn{border:1px solid var(--ac);color:var(--ac);background:none;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700}
.admin-user{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.admin-user-info{flex:1;min-width:0}
.admin-user-info b,.admin-user-info small{display:block;overflow-wrap:anywhere}
.admin-user-info small,.admin-status{color:var(--mu);font-size:12px}
.delete-btn{border:1px solid #ef4444;color:#ff8e8e;background:#32191e;border-radius:8px;padding:8px 11px;font-size:12px}
.delete-btn:disabled{opacity:.5;cursor:wait}
.abadge{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:10px;background:var(--ac);color:var(--acd);font-size:10px;font-weight:700;vertical-align:middle;white-space:nowrap}
.tag{margin-left:6px;font-size:11px;color:var(--mu);font-weight:400}
.astats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.ast{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.ast b{display:block;font-size:18px}.ast span{font-size:11px;color:var(--mu)}
.admin-user .av{flex:none}
.admin-search{width:100%;padding:12px;margin-bottom:12px}
@media(max-width:760px){
.app{grid-template-columns:1fr;border:0}
.app.chatting .side{display:none}
.app:not(.chatting) .chat{display:none}
.back{display:block}
.m{max-width:86%}
}
@media(prefers-reduced-motion:no-preference){.m{animation:pop .15s ease-out}@keyframes pop{from{opacity:0;transform:translateY(4px)}}}
</style>
</head>
<body>
<section id="auth" class="auth">
<div class="card">
<div class="logo">💬</div>
<h1 id="ah">Welcome back</h1>
<p id="asub">Log in to continue to Chatspace.</p>
<form id="af">
<div id="uf" class="field hidden"><label for="un">Username</label><input id="un" maxlength="20" autocomplete="username" placeholder="letters, numbers, underscore"></div>
<div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email" placeholder="you@example.com" required></div>
<div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Your password" required><button type="button" id="eye" class="eye">Show</button></div>
<label class="keep"><input id="keep" type="checkbox"> Keep me signed in on this device</label>
<button id="as" class="btn">Log in</button>
</form>
<button id="sw" class="link" type="button">New here? Create an account</button>
<div id="an" class="note" role="status"></div>
</div>
</section>
 
<section id="app" class="app hidden">
<aside class="side">
<div class="top"><button id="meBtn" class="me-btn grow" type="button" aria-label="My profile"><div id="myav" class="av"></div><div class="grow"><b id="myname"></b><small>Online</small></div></button><button id="adminOpen" class="admin-btn hidden" type="button">Admin</button><button id="sideMenu" class="ic" type="button" aria-label="Menu">⋮</button></div>
<div class="srch"><input id="q" placeholder="Search people" aria-label="Search people"></div>
<div id="users" class="list"></div>
</aside>
<main class="chat">
<header class="head"><button id="back" class="back" aria-label="Back to chats">‹</button><button id="pinfo" class="pinfo" type="button"><div id="pav" class="av hidden"></div><div class="grow"><b id="pn">Chatspace</b><small id="ps">Pick someone to start chatting</small></div></button><button id="srchBtn" class="ic hidden" type="button" aria-label="Search in chat">🔍</button><button id="chatMenu" class="ic hidden" type="button" aria-label="Chat options">⋮</button></header>
<div id="sbar" class="sbar hidden"><input id="cs" placeholder="Search in this chat" aria-label="Search in this chat"></div>
<div id="msgs" class="msgs"><div class="ph"><b>No chat open</b>Choose a person from the list.</div></div>
<button id="dn" class="dn hidden" type="button" aria-label="Scroll to latest">↓</button>
<div id="typing" class="typing"></div>
<div id="emo" class="emo hidden"></div>
<form id="comp" class="comp"><button id="eb" class="ic" type="button" disabled aria-label="Emoji">😊</button><textarea id="mi" rows="1" maxlength="2000" placeholder="Write a message" disabled></textarea><button id="sb" class="send" disabled>Send</button></form>
</main>
</section>
 
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<div id="adminPanel" class="admin-panel hidden" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
  <div class="admin-box">
    <div class="mh">
      <div><h2 id="adminTitle">Admin Dashboard</h2><small id="adminCount" class="admin-status">Users</small></div>
      <button id="adminClose" class="ghost" type="button">Close ✕</button>
    </div>
    <div id="adminStats" class="astats"></div>
    <input id="adminSearch" class="admin-search" type="search" placeholder="Search username or email..." aria-label="Search users">
    <div id="adminUsers" aria-live="polite"></div>
  </div>
</div>
 
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>

const SB_URL="https://isljliwaeioumljcbnkk.supabase.co";

const load=(k,d)=>{try{return{...d,...JSON.parse(localStorage.getItem(k)||"{}")}}catch(e){return d}};

let lastRead=load("cs_read",{}),S=load("cs_set",{accent:"#6ee7b7",theme:"dark",sound:true,enter:true,size:15,notif:false}),loc=load("cs_loc",{pin:[],mute:[],clear:{},hide:[],theme:{}});

 if(on){el.append(h("i"))}}
async function selProfiles(q){let r=await q("id,username,avatar_url,is_admin");if(r.error)r=await q("id,username,avatar_url");if(r.error)r=await q("id,username");return r}

  await setPhoto(st.getPublicUrl(path).data.publicUrl+"?v="+Date.now(),av);say("Photo updated.")
 }catch(e){say((e.message||"Upload failed")+" (avatars bucket / profiles.avatar_url setup check karo)",1)}}

const tm=v=>new Date(v).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
const fd=v=>new Date(v).toLocaleDateString([],{day:"numeric",month:"short",year:"numeric"});
function dayLabel(v){const d=new Date(v),n=new Date(),y=new Date();y.setDate(n.getDate()-1);
 if(d.toDateString()===n.toDateString())return"Today";if(d.toDateString()===y.toDateString())return"Yesterday";return fd(v)}
const peerOf=m=>m.sender_id===me.id?m.receiver_id:m.sender_id;

function fill(el,text){text.split(/(https?:\/\/[^\s<]+)/g).forEach((p,i)=>el.append(i%2?h("a",{href:p,target:"_blank",rel:"noopener noreferrer"},p):p))}
 
const vis=p=>(convos.get(p)||[]).filter(m=>!loc.hide.includes(m.id)&&new Date(m.created_at)>(loc.clear[p]||0));
function ingest(m){const p=peerOf(m),a=convos.get(p)||[];if(a.some(x=>x.id===m.id))return false;
 a.push(m);a.sort((x,y)=>new Date(x.created_at)-new Date(y.created_at));convos.set(p,a);return true}

 const t=$("q").value.trim().toLowerCase(),box=$("users");box.innerHTML="";
 const last=p=>vis(p.id).at(-1),pin=p=>loc.pin.includes(p.id)?1:0;

  if(pin(a)!==pin(b))return pin(b)-pin(a);

function renderChat(keep){

   selProfiles(c=>sb.from("profiles").select(c).order("username")),
   sb.from("messages").select("id,sender_id,receiver_id,content,created_at").order("created_at",{ascending:false}).limit(1000)]);
  if(ps.error||ms.error)toast((ps.error||ms.error).message);
  profiles=ps.data||[];(ms.data||[]).forEach(ingest);await loadThemes();renderUsers();
  await checkAdminAccess();live();
 })();
}
function incoming(m,p){
 if(loc.mute.includes(p))return;
 const u=profiles.find(x=>x.id===p),n=u?u.username:"someone";
 beep();if(!(peer&&peer.id===p&&!document.hidden))toast("New message from "+n);
 if(S.notif&&document.hidden&&"Notification"in window&&Notification.permission==="granted")new Notification(n,{body:m.content});
}
function live(){
 if(chan)sb.removeChannel(chan);
 chan=sb.channel("chatspace",{config:{presence:{key:me.id}}})
 .on("presence",{event:"sync"},()=>{online=new Set(Object.keys(chan.presenceState()));renderUsers();head()})
 .on("broadcast",{event:"typing"},({payload:p})=>{
  if(p.to===me.id&&peer&&p.from===peer.id){$("typing").textContent=peer.username+" is typing…";clearTimeout(typeTimer);typeTimer=setTimeout(()=>$("typing").textContent="",2500)}})
 .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},({new:m})=>{
  if(m.sender_id!==me.id&&m.receiver_id!==me.id)return;
  if(!ingest(m))return;
  const p=peerOf(m);
  if(peer&&peer.id===p&&!document.hidden){markRead(p);renderChat();$("typing").textContent=""}
  else if(peer&&peer.id===p)renderChat();
  if(m.sender_id!==me.id)incoming(m,p);
  renderUsers()})
 .on("postgres_changes",{event:"INSERT",schema:"public",table:"profiles"},({new:p})=>{if(!profiles.some(x=>x.id===p.id)){profiles.push({id:p.id,username:p.username,avatar_url:p.avatar_url,is_admin:p.is_admin});renderUsers()}})
 .on("postgres_changes",{event:"UPDATE",schema:"public",table:"profiles"},({new:p})=>{const x=profiles.find(y=>y.id===p.id);if(x){x.username=p.username;x.avatar_url=p.avatar_url;x.is_admin=p.is_admin;if(peer&&peer.id===p.id){setName($("pn"),p.username,p.is_admin);avatar($("pav"),p.username,0,p.avatar_url)}renderUsers()}})
 .on("postgres_changes",{event:"DELETE",schema:"public",table:"profiles"},({old:p})=>{profiles=profiles.filter(x=>x.id!==p.id);convos.delete(p.id);if(peer&&peer.id===p.id)closeChat();renderUsers()})
 .subscribe(async s=>{if(s==="SUBSCRIBED")await chan.track({at:Date.now()});if(s==="CHANNEL_ERROR")toast("Live connection lost. Refresh to reconnect.")});
 if(tchan)sb.removeChannel(tchan);
 tchan=sb.channel("chat-themes").on("postgres_changes",{event:"*",schema:"public",table:"chat_themes"},({new:r})=>{
  if(!r||(r.user_a!==me.id&&r.user_b!==me.id))return;const pid=r.user_a===me.id?r.user_b:r.user_a;shared.set(pid,r);
  if(peer&&peer.id===pid){applyChatTheme();if(r.updated_by!==me.id){const t=THEMES[r.theme];toast(peer.username+" changed the chat theme"+(t?" to "+t.n:""))}}}).subscribe();
}
async function logout(){if(chan)await sb.removeChannel(chan);await sb.auth.signOut();location.reload()}
 
// ---------- events ----------
$("sw").onclick=()=>{signup=!signup;$("uf").classList.toggle("hidden",!signup);$("as").textContent=signup?"Create account":"Log in";
 $("ah").textContent=signup?"Create your account":"Welcome back";
 $("asub").textContent=signup?"Private one-to-one chats with people you know.":"Log in to continue to Chatspace.";
 $("pw").autocomplete=signup?"new-password":"current-password";$("pw").minLength=signup?8:0;
 $("pw").placeholder=signup?"At least 8 characters":"Your password";
 $("sw").textContent=signup?"Have an account? Log in":"New here? Create an account";note("")};
$("eye").onclick=()=>{const p=$("pw"),s=p.type==="password";p.type=s?"text":"password";$("eye").textContent=s?"Hide":"Show"};
$("af").onsubmit=async e=>{
 e.preventDefault();const email=$("em").value.trim(),password=$("pw").value,username=$("un").value.trim();
 $("as").disabled=true;note("One moment…");
 try{localStorage.setItem("cs_keep",$("keep").checked?"1":"0");sessionStorage.setItem("cs_alive","1")}catch(_){}
 try{
  if(signup){
   if(!/^[A-Za-z0-9_]{3,20}$/.test(username))throw new Error("Username needs 3–20 letters, numbers or underscores.");
   const{data,error}=await sb.auth.signUp({email,password,options:{data:{username}}});if(error)throw error;
   if(data.session){await boot(data.user)}else note("Account created. Confirm your email, then log in. Check your inbox and click the verification link.")
  }else{const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;await boot(data.user)}
 }catch(err){note(err.message||"Something went wrong.",true)}
 $("as").disabled=false};
 
async function send(){
 const c=$("mi").value.trim();if(!c||!peer)return;
 $("sb").disabled=true;
 const{data,error}=await sb.from("messages").insert({sender_id:me.id,receiver_id:peer.id,content:c}).select("id,sender_id,receiver_id,content,created_at").single();
 $("sb").disabled=false;
 if(error){toast("Message not sent: "+error.message);return}
 ingest(data);markRead(peer.id);renderChat();renderUsers();$("mi").value="";$("mi").style.height="auto";$("emo").classList.add("hidden");$("mi").focus();
}
$("comp").onsubmit=e=>{e.preventDefault();send()};
$("mi").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing&&(S.enter?!e.shiftKey:e.ctrlKey)){e.preventDefault();send()}});
$("mi").addEventListener("input",()=>{
 const t=$("mi");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,130)+"px";
 if(chan&&peer&&Date.now()-typeSent>1500){typeSent=Date.now();chan.send({type:"broadcast",event:"typing",payload:{from:me.id,to:peer.id}})}});
EMOJI.forEach(x=>$("emo").append(h("button",{type:"button",onclick:()=>{const t=$("mi");t.value+=x;t.focus()}},x)));
$("eb").onclick=()=>$("emo").classList.toggle("hidden");
$("q").oninput=renderUsers;
$("back").onclick=closeChat;
$("meBtn").onclick=profileModal;
$("sideMenu").onclick=e=>showMenu(e.currentTarget,[["👤 My profile",profileModal],["⚙️ Settings",settingsModal],...(isAdmin?[["🛡️ Admin panel",openAdmin]]:[]),["🚪 Log out",logout]]);
$("pinfo").onclick=()=>{if(peer)contactModal()};
$("srchBtn").onclick=toggleSearch;
$("cs").oninput=e=>{term=e.target.value.trim().toLowerCase();renderChat(true)};
$("chatMenu").onclick=e=>showMenu(e.currentTarget,[["ℹ️ Contact info",contactModal],["🎨 Chat theme",themeModal],[loc.pin.includes(peer.id)?"📌 Unpin chat":"📌 Pin chat",togglePin],[loc.mute.includes(peer.id)?"🔔 Unmute chat":"🔕 Mute chat",toggleMute],["⬇️ Export chat",exportChat],["🧹 Clear chat",clearChat]]);
$("msgs").addEventListener("scroll",()=>{const b=$("msgs");$("dn").classList.toggle("hidden",b.scrollHeight-b.scrollTop-b.clientHeight<200)});
$("dn").onclick=()=>{$("msgs").scrollTo({top:$("msgs").scrollHeight,behavior:"smooth"})};
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();$("adminPanel").classList.add("hidden")}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&peer){markRead(peer.id);renderUsers()}});
 
$("adminClose").onclick=()=>$("adminPanel").classList.add("hidden");
$("adminPanel").addEventListener("click",e=>{if(e.target===$("adminPanel"))$("adminPanel").classList.add("hidden")});
$("adminSearch").oninput=renderAdminUsers;
$("adminOpen").onclick=openAdmin;
 
(async()=>{
 applySettings();
 if(!window.supabase){note("Could not load Supabase. Check your connection.",true);return}
 sb=window.supabase.createClient(SB_URL,SB_KEY);
 sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"&&me)location.reload()});
 let keep=false,alive=false;
 try{keep=localStorage.getItem("cs_keep")==="1";alive=!!sessionStorage.getItem("cs_alive");sessionStorage.setItem("cs_alive","1")}catch(_){}
 $("keep").checked=keep;
 const{data}=await sb.auth.getSession();
 if(data.session){
  // Not "keep me signed in" and a fresh open -> show login page first
  if(!keep&&!alive)await sb.auth.signOut({scope:"local"});
  else await boot(data.session.user);
 }
})();
